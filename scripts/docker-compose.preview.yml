services:
  ttd-guard:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ttd-guard:preview
    container_name: ttd-guard-preview
    restart: "no"
    network_mode: host
    environment:
      WEB_USER: admin
      WEB_PASSWORD: change-me-before-use
      TZ: Asia/Shanghai
      ENABLE_CD2_WATCHDOG: "0"
    volumes:
      - ../preview-data:/data
      - /path/to/local-strm:/media/local:ro
      - /path/to/share-strm:/media/share:ro
      - /path/to/cloud:/media/cloud:rslave
