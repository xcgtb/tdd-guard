# GHCR 预构建镜像示例
services:
  tdd-guard:
    image: ghcr.io/xcgtb/tdd-guard:latest
    container_name: tdd-guard
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      AGENT_DATA: /data
      L_ROOT: /media/local
      S_ROOT: /media/share
      CLOUD_L_ROOT: /media/cloud
      ENABLE_CD2_WATCHDOG: ${ENABLE_CD2_WATCHDOG:-0}
    volumes:
      - ./data:/data
      - /path/to/local-strm:/media/local
      - /path/to/share-strm:/media/share
      # 使用 CloudDrive2 联动时保留
      - /path/to/cloud:/media/cloud:rslave
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
