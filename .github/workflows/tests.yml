name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Static check (undefined names / _eng / dual imports / module attrs)
        run: python3 scripts/static_check.py

      - name: Release check
        run: python3 scripts/release_check.py

      - name: Frontend JS syntax
        run: |
          python3 - <<'PY'
          import re
          s = open('static/index.html', encoding='utf-8').read()
          for i, b in enumerate(re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', s, re.S)):
              open(f'/tmp/blk{i}.js', 'w', encoding='utf-8').write(b)
          PY
          for f in /tmp/blk*.js; do node --check "$f"; done

      - name: Run tests
        run: pytest tests/ -v
